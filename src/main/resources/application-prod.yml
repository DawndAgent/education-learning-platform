# 生产配置。密钥与连接信息必须通过环境变量注入，禁止写入仓库。
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 20
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
  flyway:
    enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:2h}
  cors:
    allowed-origins:
      - ${ADMIN_ORIGIN}
  wechat:
    miniapp:
      app-id: ${WECHAT_MINIAPP_APP_ID:}
      app-secret: ${WECHAT_MINIAPP_APP_SECRET:}
      env-version: ${WECHAT_MINIAPP_ENV_VERSION:release}
      mock-enabled: ${WECHAT_MINIAPP_MOCK:false}

storage:
  type: cos
  cos:
    secret-id: ${COS_SECRET_ID}
    secret-key: ${COS_SECRET_KEY}
    region: ${COS_REGION}
    bucket: ${COS_BUCKET}
    public-base-url: ${COS_PUBLIC_BASE_URL}

logging:
  level:
    root: warn
    com.xxedu.learning: info
