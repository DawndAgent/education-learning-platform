spring:
  application:
    name: education-learning-platform
  profiles:
    default: dev
  jackson:
    time-zone: Asia/Shanghai
  mvc:
    throw-exception-if-no-handler-found: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl: 2h
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:5174
      - http://127.0.0.1:5174
  id-generator:
    worker-id: ${WORKER_ID:1}
    datacenter-id: ${DATACENTER_ID:1}

content:
  publish:
    scheduler-enabled: ${CONTENT_PUBLISH_SCHEDULER_ENABLED:true}
    interval-ms: ${CONTENT_PUBLISH_INTERVAL_MS:30000}

storage:
  type: local
  local:
    base-path: ./data/uploads
    public-url-prefix: /uploads

logging:
  level:
    root: info
    com.xxedu.learning: info
