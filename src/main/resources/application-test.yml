spring:
  datasource:
    url: jdbc:h2:mem:education_learning;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379

storage:
  type: local
  local:
    base-path: ./target/test-uploads
    public-url-prefix: /uploads

app:
  jwt:
    secret: test-only-jwt-secret-key-32bytes!!
    ttl: 2h
  wechat:
    miniapp:
      mock-enabled: true
      env-version: develop

content:
  publish:
    scheduler-enabled: false
    interval-ms: 30000

logging:
  level:
    root: warn
    com.xxedu.learning: info
