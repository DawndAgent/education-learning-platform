# 本地开发配置。数据库口令只允许通过环境变量覆盖，默认值仅供本机。
spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/education_learning?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
      minimum-idle: 1
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

app:
  jwt:
    # 仅用于本地开发。生产环境必须通过 JWT_SECRET 注入独立密钥，不能使用这个默认值。
    secret: ${JWT_SECRET:change-me-dev-only-jwt-secret-32bytes}
  wechat:
    miniapp:
      # 本地默认 mock；配置了真实密钥后可设 WECHAT_MINIAPP_MOCK=false
      mock-enabled: ${WECHAT_MINIAPP_MOCK:true}

logging:
  level:
    com.xxedu.learning: debug
